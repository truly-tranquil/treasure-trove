site_name: Treasure Trove
site_url: https://truly-tranquil.github.io/treasure-trove/
site_description: Treasure Trove is a community-run adult learning space with free, self-paced courses and a library of free and low-cost learning resources.
dev_addr: 127.0.0.1:8001

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.ico
  features:
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - header.autohide
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/keyboard.js

hooks: []

plugins:
  - search
  - callouts
  - redirects
  - minify:
      htmlmin_opts:
        remove_comments: true
  # The footer date is the file's last git commit date, never the build date.
  # Deploys check out full history (fetch-depth: 0) so this always resolves.
  - git-revision-date-localized:
      type: date
      timezone: America/New_York
      fallback_to_build_date: false
  - awesome-pages:
      filename: .pages
  - glightbox
  - macros
  - htmlproofer:
      validate_external_urls: false
  - print-site

markdown_extensions:
  - nl2br
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - abbr
  - nl2br
  - md_in_html
  - footnotes
  - def_list
  - abbr
  - pymdownx.saneheaders
  - pymdownx.saneheaders
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: "¶"
      permalink_title: "Link to this section"
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true

