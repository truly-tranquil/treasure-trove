site_name: Treasure Trove
site_url: https://truly-tranquil.github.io/treasure-trove/
site_description: Treasure Trove is a community-run adult learning space with free, self-paced courses and a library of free and low-cost learning resources.
dev_addr: 127.0.0.1:8001

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.ico
  features:
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - header.autohide
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/keyboard.js

hooks: []

plugins:
  - search

nav:
  - Home: index.md
  - Courses:
      - Overview: courses/index.md
      - "Student Success 101":
          - Overview: courses/intro-to-student-success/index.md
          - Syllabus: courses/intro-to-student-success/syllabus.md
          - Capstone: courses/intro-to-student-success/capstone.md
          - Facilitator Guide: courses/intro-to-student-success/facilitator-guide.md
          - "Module 1: Foundations & Mindset":
              - Overview: courses/intro-to-student-success/module-1/index.md
              - Materials: courses/intro-to-student-success/module-1/materials.md
              - "Session 1": courses/intro-to-student-success/module-1/session-1.md
              - "Session 2": courses/intro-to-student-success/module-1/session-2.md
              - "Session 3": courses/intro-to-student-success/module-1/session-3.md
              - "Session 4": courses/intro-to-student-success/module-1/session-4.md
          - "Module 2: Learning How to Learn":
              - Overview: courses/intro-to-student-success/module-2/index.md
              - Materials: courses/intro-to-student-success/module-2/materials.md
              - "Session 1": courses/intro-to-student-success/module-2/session-1.md
              - "Session 2": courses/intro-to-student-success/module-2/session-2.md
              - "Session 3": courses/intro-to-student-success/module-2/session-3.md
              - "Session 4": courses/intro-to-student-success/module-2/session-4.md
          - "Module 3: Time, Procrastination & Systems":
              - Overview: courses/intro-to-student-success/module-3/index.md
              - Materials: courses/intro-to-student-success/module-3/materials.md
              - "Session 1": courses/intro-to-student-success/module-3/session-1.md
              - "Session 2": courses/intro-to-student-success/module-3/session-2.md
              - "Session 3": courses/intro-to-student-success/module-3/session-3.md
              - "Session 4": courses/intro-to-student-success/module-3/session-4.md
          - "Module 4: Well-being, Resources & Sustainability":
              - Overview: courses/intro-to-student-success/module-4/index.md
              - Materials: courses/intro-to-student-success/module-4/materials.md
              - "Session 1": courses/intro-to-student-success/module-4/session-1.md
              - "Session 2": courses/intro-to-student-success/module-4/session-2.md
              - "Session 3": courses/intro-to-student-success/module-4/session-3.md
              - "Session 4": courses/intro-to-student-success/module-4/session-4.md
          - "Further Resources": courses/intro-to-student-success/further-reading.md
  - Learning Library: learning-library.md
  - Get Help: get-help.md
  - What's Next: whats-next.md
  - Meet the Team: meet-the-team.md

markdown_extensions:
  - nl2br
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - abbr
  - pymdownx.saneheaders
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: "¶"
      permalink_title: "Link to this section"
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true

