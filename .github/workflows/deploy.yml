name: deploy treasure-trove
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build site from a clean directory
        run: |
          rm -rf site
          python -m zensical build --strict --clean
      - run: python -m unittest discover -s tests -v

      # Guard against accidentally publishing output from a second generator
      # (for example a leftover MkDocs build) or an incomplete theme.
      - name: Verify one generator produced the site
        run: |
          status=0
          while IFS= read -r page; do
            if ! grep -q 'name="generator" content="zensical-' "$page"; then
              echo "::error file=$page::Page is missing the Zensical generator tag"
              status=1
            fi
            if ! grep -q 'class="md-header' "$page"; then
              echo "::error file=$page::Page is missing the shared header"
              status=1
            fi
            if ! grep -q 'class="md-footer"' "$page"; then
              echo "::error file=$page::Page is missing the shared footer"
              status=1
            fi
          done < <(find site -name index.html)
          if grep -rl 'mkdocs' --include='*.html' site; then
            echo "::error::MkDocs output found in the build"
            status=1
          fi
          exit "$status"
      - name: Prepare lychee root for GitHub Pages base path
        run: |
          mkdir -p "$RUNNER_TEMP/lychee-root"
          ln -s "$GITHUB_WORKSPACE/site" "$RUNNER_TEMP/lychee-root/treasure-trove"
      # Only check links between our own pages here. External sites routinely
      # answer automated checkers with 403/429, which made deploys fail for
      # reasons unrelated to the content. External links are audited weekly by
      # .github/workflows/link-audit.yml instead.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --verbose --no-progress --root-dir ${{ runner.temp }}/lychee-root site
      - name: Audit accessibility
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
