name: audit external links

on:
  schedule:
    # Every Monday at 06:17 UTC. Off the hour to avoid the busiest runner window.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # This checks the links written in docs/ (not the generated site), so it
      # does not need a full MkDocs build. Settings live in lychee.toml.
      - name: Audit external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --config lychee.toml docs
          fail: false

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: lychee/out.md
          retention-days: 30

      # Keep the report visible as a failed run, but remember this workflow is
      # separate from deploy.yml, so it never blocks publishing the site.
      - name: Fail when broken links were found
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
