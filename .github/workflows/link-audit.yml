name: audit external links

on:
  schedule:
    # Every Monday at 06:17 UTC. Off the hour to avoid the busiest runner window.
    - cron: "17 6 * * 1"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # This checks the links written in docs/ (not the generated site), so it
      # does not need a full MkDocs build. Settings live in lychee.toml
      # (bot-blocking hosts such as reddit.com and linkedin.com are excluded).
      - name: Audit external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --config lychee.toml docs
          fail: false

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: lychee/out.md
          retention-days: 30

      # Fail the run (and the pull request check) when broken links were found.
      # The report is uploaded first so the failing links stay inspectable.
      - name: Fail when broken links were found
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
